# Polls the results endpoint every 5 min (Tier 1 football-data.org).
# Also pulls goal scorers and group standings on each run.
#
# PRIMARY cron: cron-job.org (external — reliable 5-min schedule)
# BACKUP  cron: this workflow (GitHub may throttle scheduled runs on low-activity repos)
#
# Repo secrets needed (Settings → Secrets and variables → Actions):
#   APP_URL     = https://sotg.app
#   CRON_SECRET = same value as in Vercel env CRON_SECRET
name: Poll World Cup results
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the results endpoint
        run: |
          RESPONSE=$(curl -sS -w "\n%{http_code}" -m 60 \
            "${{ secrets.APP_URL }}/api/cron/results?secret=${{ secrets.CRON_SECRET }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: unexpected HTTP status $HTTP_CODE"
            exit 1
          fi
          echo "poll complete"
